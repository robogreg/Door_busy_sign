; Door Sign firmware. See SPEC.md.

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Official Espressif platform (Arduino-ESP32 core 2.0.17).
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    zinggjm/GxEPD2@^1.6.9
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    esp32async/AsyncTCP@^3.6.1
    esp32async/ESPAsyncWebServer@^3.12.1
    bblanchon/ArduinoJson@^7.4.3
test_ignore = *

; Same build, uploaded over Wi-Fi to the sign's dashboard instead of USB:
;   set DOOR_PIN to the sign's PIN, then
;   pio run -d firmware -e ota -t upload --upload-port <sign IP or door.local>
[env:ota]
extends = env:esp32dev
upload_protocol = custom
upload_port = door.local
upload_command = curl --fail-with-body -sS -F "firmware=@$SOURCE" "http://$UPLOAD_PORT/api/ota?k=${sysenv.DOOR_PIN}"

; Host-side unit tests for lib/core. Needs a host C++ compiler (MinGW-w64 on Windows).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
